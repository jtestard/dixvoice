# Namespace, image registry and CDN are still "TBD" (README): fill them in with the Go backend's values.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio-service
  labels: {app: audio-service}
spec:
  replicas: 1                  # the registry lives in memory: exactly one replica
  strategy: {type: Recreate}   # never two pods writing the same storage
  selector:
    matchLabels: {app: audio-service}
  template:
    metadata:
      labels: {app: audio-service}
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: audio-service
          image: REGISTRY/audio-service:TAG   # TBD
          ports: [{containerPort: 8080, name: http}]
          env:
            - {name: PROVIDER, value: gradium}
            - {name: GRADIUM_MODEL, value: gradium-tts-beta}
            - {name: GRADIUM_FALLBACK_MODEL, value: default}
            - {name: STORAGE, value: s3}
            - {name: S3_BUCKET, value: dixvoice-clips}
            - {name: AWS_REGION, value: eu-west-1}
            - {name: CDN_PUBLIC_URL, value: "https://dp1tbjxi4bfec.cloudfront.net"}   # CloudFront in front of the bucket
            - {name: SERVE_LOCAL_CDN, value: "0"}
            - name: GRADIUM_API_KEY
              valueFrom: {secretKeyRef: {name: audio-service-secrets, key: GRADIUM_API_KEY}}
            # Use a key limited to s3:GetObject/PutObject on dixvoice-clips/audio/*, never an admin key.
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: audio-service-secrets, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: audio-service-secrets, key: AWS_SECRET_ACCESS_KEY}}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20, failureThreshold: 3}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {memory: 512Mi}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: audio-service-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audio-service-data
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
