# Only the Go backend may reach the service (POST /audio has no authentication). Adjust the backend's labels.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audio-service-ingress
spec:
  podSelector:
    matchLabels: {app: audio-service}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: backend}   # TBD: label of the Go backend pods
      ports: [{port: 8080}]
