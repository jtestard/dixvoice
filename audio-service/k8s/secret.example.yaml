# Example only. Create the real secret with:
#   kubectl create secret generic audio-service-secrets --from-env-file=<(cat ../secret/audio.env ../secret/aws.env | grep -E '^(GRADIUM_API_KEY|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY)=')
apiVersion: v1
kind: Secret
metadata:
  name: audio-service-secrets
type: Opaque
stringData:
  GRADIUM_API_KEY: "replace-me"
  AWS_ACCESS_KEY_ID: "replace-me"
  AWS_SECRET_ACCESS_KEY: "replace-me"
