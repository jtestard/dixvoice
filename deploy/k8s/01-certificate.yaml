# TLS for the public hosts, issued by the cluster's Let's Encrypt issuer (DNS-01 through Route53).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dixvoice-tls
  namespace: dixvoice
spec:
  secretName: dixvoice-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - dixvoice.api.gcast.app
    - dixvoice-web.api.gcast.app
    - dixvoice-sample.api.gcast.app
