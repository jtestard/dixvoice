[project]
name = "dixvoice-audio"
version = "0.1.0"
description = "Dixvoice audio generator microservice: lists, returns and generates speech clips of at most 2 seconds with Gradium TTS."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "numpy>=2.0",
    "soundfile>=0.13",
    "boto3>=1.43.103",
]

[project.scripts]
dixvoice-audio = "audio_service.main:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.23",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "audio_service"
