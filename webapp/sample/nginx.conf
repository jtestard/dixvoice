server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript;

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ =404;
    }
}
